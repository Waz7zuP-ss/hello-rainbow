<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
<meta name="description" content="Hello World with a flowing rainbow gradient">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0b0518;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }
  .bg{position:fixed;inset:-40%;filter:blur(60px);opacity:.95;animation:spin 18s linear infinite;
    background:conic-gradient(from 0deg,#ff3b30,#ff9500,#ffcc00,#34c759,#00c7be,#0a84ff,#5e5ce6,#af52de,#ff2d55,#ff3b30);
  }
  .bg2{position:fixed;inset:-40%;filter:blur(90px);opacity:.55;animation:spin 26s linear infinite reverse;
    background:conic-gradient(from 120deg,#00c7be,#ff2d55,#ffd60a,#0a84ff,#af52de,#00c7be);
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .wrap{position:relative;text-align:center;padding:24px}
  h1{
    font-size:clamp(2.6rem,11vw,7rem);font-weight:800;letter-spacing:-.03em;line-height:1;
    background:linear-gradient(100deg,#ff5f6d,#ffc371,#47e3a1,#38b6ff,#a06bff,#ff5f6d);
    background-size:300% 300%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:flow 6s ease infinite;
    text-shadow:0 0 40px rgba(120,80,255,.35);
  }
  @keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  p{margin-top:18px;color:#dcd0ff;font-size:clamp(.9rem,3.5vw,1.15rem);opacity:.85;letter-spacing:.14em;text-transform:lowercase}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="bg2"></div>
  <div class="wrap">
    <h1>hello world</h1>
    <p>🌈 flowing rainbow</p>
  </div>
</body>
</html>
